version: 1

# rate limiting policies for compliance and abuse prevention.

policies:
  - name: rate_limit_strict
    trigger:
      tool_calls_per_minute:
        gt: 30
    decision: DENY
    reason: "strict rate limit: more than 30 calls per minute"

  - name: rate_limit_relaxed
    trigger:
      tool_calls_per_minute:
        gt: 60
    decision: DENY
    reason: "relaxed rate limit: more than 60 calls per minute"
