services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      timeout: 5s
      retries: 5

  aegis:
    build:
      context: ./core
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://aegis:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/aegis?sslmode=disable
      AEGIS_API_KEY: ${AEGIS_API_KEY:?AEGIS_API_KEY is required}
      AEGIS_ADDR: ":8080"
    ports:
      - "8080:8080"
    volumes:
      - ./aegis.config.yaml:/aegis.config.yaml:ro
    command: ["serve", "--config", "/aegis.config.yaml"]

volumes:
  pgdata:
